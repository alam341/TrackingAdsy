<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rekap Laporan — adsy-tracking</title>
<link rel="icon" type="image/png" href="img/logo-adsy.png">
<link rel="stylesheet" href="css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ── Summary cards ────────────────────────────────────────────────── */
.rl-summary {
  display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 16px;
}
@media (max-width: 1200px) { .rl-summary { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 768px)  { .rl-summary { grid-template-columns: repeat(2, 1fr); } }
.rl-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 16px 18px;
  cursor: default; transition: border-color .15s, box-shadow .15s;
}
.rl-card.clickable {
  cursor: pointer;
}
.rl-card.clickable:hover {
  border-color: var(--primary); box-shadow: 0 0 0 3px rgba(67,97,238,.1);
}
.rl-card.active {
  border-color: var(--primary); box-shadow: 0 0 0 3px rgba(67,97,238,.15);
  background: rgba(67,97,238,.04);
}
.rl-card-label { font-size: .72rem; font-weight: 600; color: var(--text-3); margin-bottom: 6px; }
.rl-card-num   { font-size: 1.6rem; font-weight: 800; line-height: 1; }
.rl-card-sub   { font-size: .72rem; color: var(--text-3); margin-top: 4px; }

/* Skeleton */
.rl-skel { height: 12px; border-radius: 6px; background: var(--border); margin-bottom: 8px; animation: rlPulse 1.2s ease-in-out infinite; }
.rl-skel.big { height: 28px; width: 55%; margin-bottom: 6px; }
@keyframes rlPulse { 0%,100%{opacity:1} 50%{opacity:.4} }

/* ── Filter bar ───────────────────────────────────────────────────── */
.rl-filter {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px 16px; margin-bottom: 16px;
}
.rl-select {
  border: 1px solid var(--border); background: var(--input-bg); color: var(--text-1);
  border-radius: 8px; padding: 6px 10px; font-size: .82rem; font-family: inherit; cursor: pointer;
}
.rl-preset {
  border: 1px solid var(--border); background: var(--input-bg); color: var(--text-2);
  border-radius: 8px; padding: 6px 12px; font-size: .78rem; font-weight: 600; cursor: pointer; transition: all .15s;
}
.rl-preset:hover, .rl-preset.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.rl-filter input[type=date] {
  border: 1px solid var(--border); background: var(--input-bg);
  color: var(--text-1); border-radius: 8px; padding: 6px 10px;
  font-size: .82rem; font-family: inherit; cursor: pointer;
}
.rl-refresh { border: 1px solid var(--border); background: var(--input-bg); color: var(--text-2); border-radius: 8px; padding: 6px 14px; font-size: .78rem; font-weight: 600; cursor: pointer; transition: all .15s; }
.rl-refresh:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

/* ── Section cards ────────────────────────────────────────────────── */
.rl-section {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; margin-bottom: 16px; overflow: hidden;
}
.rl-section-header {
  padding: 14px 18px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.rl-section-title { font-size: .9rem; font-weight: 700; }
.rl-section-sub   { font-size: .75rem; color: var(--text-3); margin-top: 2px; }

/* ── Ekspedisi breakdown ──────────────────────────────────────────── */
.rl-eksp-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px; padding: 16px;
}
.rl-eksp-card {
  border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px;
}
.rl-eksp-name  { font-size: .88rem; font-weight: 700; margin-bottom: 10px; }
.rl-eksp-row   { display: flex; justify-content: space-between; font-size: .78rem; margin-bottom: 4px; }
.rl-eksp-label { color: var(--text-3); }
.rl-eksp-val   { font-weight: 600; }
.rl-bar-wrap   { height: 6px; background: var(--border); border-radius: 99px; margin-top: 10px; overflow: hidden; }
.rl-bar-fill   { height: 100%; border-radius: 99px; transition: width .5s; }

/* ── Table ────────────────────────────────────────────────────────── */
.rl-table td, .rl-table th { padding: 9px 14px; }
.rl-table th { font-size: .72rem; font-weight: 700; color: var(--text-3); white-space: nowrap; }
.rl-table td { font-size: .8rem; border-top: 1px solid var(--border); }
.rl-table tbody tr:hover td { background: rgba(67,97,238,.03); }

/* ── Status pill ──────────────────────────────────────────────────── */
.rl-pill {
  display: inline-block; border-radius: 6px; padding: 2px 9px;
  font-size: .72rem; font-weight: 700;
}
.rl-pill-invst  { background: rgba(123,47,190,.12); color: #7B2FBE; }
.rl-pill-lapor  { background: rgba(67,97,238,.1);   color: var(--primary); }
.rl-pill-ok     { background: rgba(6,194,112,.1);   color: var(--success); }

.rl-loading { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 48px; color: var(--text-3); }
.rl-pagination { display: flex; align-items: center; gap: 10px; justify-content: center; padding: 14px 0 4px; }

/* ── Resi clickable ────────────────────────────────────────────────── */
.rl-resi-link {
  font-weight: 700; font-size: .78rem; color: var(--primary);
  cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
  font-family: monospace;
}
.rl-resi-link:hover { opacity: .75; }

/* ── Resi detail modal ─────────────────────────────────────────────── */
.rl-resi-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1000;
  display: none; align-items: center; justify-content: center; padding: 16px;
}
.rl-resi-overlay.open { display: flex; }
.rl-resi-modal {
  background: var(--card); border-radius: 16px; width: 100%; max-width: 460px;
  max-height: 85vh; display: flex; flex-direction: column;
  box-shadow: 0 8px 40px rgba(0,0,0,.18);
}
.rl-resi-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  padding: 16px 18px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.rl-resi-title    { font-family: monospace; font-size: .9rem; font-weight: 700; word-break: break-all; }
.rl-resi-subtitle { font-size: .65rem; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; }
.rl-resi-close    { background: none; border: none; font-size: 1.3rem; line-height: 1; cursor: pointer; color: var(--text-3); padding: 0 0 0 8px; flex-shrink: 0; }
.rl-resi-close:hover { color: var(--text-1); }
.rl-resi-info {
  display: grid; grid-template-columns: 1fr 1fr; padding: 10px 18px;
  border-bottom: 1px solid var(--border); gap: 0; flex-shrink: 0;
}
.rl-resi-info-item { padding: 6px 0; border-right: 1px solid var(--border); }
.rl-resi-info-item:nth-child(even) { border-right: none; padding-left: 14px; }
.rl-resi-info-label { font-size: .62rem; font-weight: 600; color: var(--text-3); text-transform: uppercase; margin-bottom: 2px; }
.rl-resi-info-val   { font-size: .8rem; font-weight: 600; }
.rl-resi-body   { overflow-y: auto; padding: 14px 18px 18px; flex: 1; }
.rl-resi-loading{ text-align: center; padding: 32px 16px; color: var(--text-3); font-size: .83rem; }
.rl-tl-item {
  display: grid; grid-template-columns: 100px 1fr; gap: 12px;
  padding: 8px 0; border-bottom: 1px solid var(--border);
}
.rl-tl-item:last-child { border-bottom: none; }
.rl-tl-item.first .rl-tl-desc { color: var(--primary); font-weight: 700; }
.rl-tl-time { font-size: .62rem; color: var(--text-3); line-height: 1.4; padding-top: 2px; }
.rl-tl-desc { font-size: .75rem; line-height: 1.45; }
.rl-tl-loc  { font-size: .65rem; color: var(--text-3); margin-top: 2px; }
.rl-resi-cek-btn {
  display: block; width: 100%; margin-top: 14px;
  background: var(--primary); color: #fff; border: none; border-radius: 10px;
  padding: 10px; font-size: .82rem; font-weight: 700; cursor: pointer; transition: opacity .15s;
}
.rl-resi-cek-btn:hover { opacity: .88; }
.rl-resi-cek-btn:disabled { opacity: .5; cursor: default; }

/* ── Mobile ───────────────────────────────────────────────────────── */
@media (max-width: 768px) {
  .rl-filter { gap: 7px; padding: 10px 12px; }
  .rl-eksp-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; padding: 12px; }
  .rl-table td, .rl-table th { padding: 8px 10px; }
  .rl-section-header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
@media (max-width: 480px) {
  .rl-summary { grid-template-columns: 1fr 1fr; }
  .rl-card-num { font-size: 1.5rem; }
  .rl-filter { flex-direction: column; align-items: stretch; }
  .rl-filter label { display: none; }
  .rl-preset, .rl-refresh, .rl-select,
  .rl-filter input[type=date] { width: 100%; text-align: center; }
  .rl-eksp-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<div id="sidebar-slot"></div>
<div id="header-slot"></div>
<div class="main-content">
  <div class="page" id="pageContent"></div>
</div>

<!-- Modal riwayat pengiriman resi -->
<div id="rlResiOverlay" class="rl-resi-overlay" onclick="if(event.target===this)rlCloseResiModal()">
  <div class="rl-resi-modal">
    <div class="rl-resi-header">
      <div>
        <div class="rl-resi-subtitle">Riwayat Pengiriman</div>
        <div class="rl-resi-title" id="rlResiTitle">—</div>
      </div>
      <button class="rl-resi-close" onclick="rlCloseResiModal()">×</button>
    </div>
    <div class="rl-resi-info" id="rlResiInfo"></div>
    <div class="rl-resi-body" id="rlResiBody">
      <div class="rl-resi-loading">Memuat…</div>
    </div>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
// ── State ──────────────────────────────────────────────────────────────────────
let _rlData       = []; // semua room_work yang lapor_ekspedisi = true
let _rlCS         = '';
let _rlEksp       = '';
let _rlStatus     = ''; // '' | 'antar_ulang' | 'konfirmasi_retur' | 'investigasi' | 'terkirim'
let _rlCardFilter = ''; // '' | 'antar_ulang' | 'konfirmasi_retur' | 'investigasi' | 'terkirim'
let _rlPage       = 1;
const RL_PAGE_SIZE = 20;

let _rlDateTo   = wibYMD();
let _rlDateFrom = wibYMD().slice(0, 7) + '-01';
let _rlPreset   = 'bulan-ini';

// ── Helpers ────────────────────────────────────────────────────────────────────
function fmtTgl(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: '2-digit' });
}
function fmtDurDays(iso) {
  if (!iso) return '—';
  const d = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  return d === 0 ? 'Hari ini' : `${d} hari lalu`;
}

// ── Render shell ───────────────────────────────────────────────────────────────
function rlRenderPage() {
  document.getElementById('pageContent').innerHTML = `
    <div id="rlSummary">
      <div class="rl-summary">
        ${Array(4).fill(`<div class="rl-card"><div class="rl-skel" style="width:60%"></div><div class="rl-skel big"></div><div class="rl-skel" style="width:75%"></div></div>`).join('')}
      </div>
    </div>
    <div class="rl-filter">
      <label style="font-size:.78rem;color:var(--text-3);font-weight:600">Periode</label>
      <input type="date" id="rlFrom" value="${_rlDateFrom}" onchange="rlSetDate()">
      <span style="color:var(--text-3);font-size:.8rem">–</span>
      <input type="date" id="rlTo" value="${_rlDateTo}" onchange="rlSetDate()">
      <button class="rl-preset ${_rlPreset==='bulan-ini' ?'active':''}" onclick="rlPreset('bulan-ini')">Bulan Ini</button>
      <button class="rl-preset ${_rlPreset==='bulan-lalu'?'active':''}" onclick="rlPreset('bulan-lalu')">Bulan Lalu</button>
      <select class="rl-select" id="rlCSSel"     onchange="rlSetCS(this.value)"><option value="">Semua CS</option></select>
      <select class="rl-select" id="rlEkspSel"   onchange="rlSetEksp(this.value)"><option value="">Semua Ekspedisi</option></select>
      <select class="rl-select" id="rlStatusSel" onchange="rlSetStatus(this.value)">
        <option value="">Semua Status</option>
        <option value="antar_ulang">🔄 Antar Ulang</option>
        <option value="konfirmasi_retur">↩️ Konfirmasi Retur</option>
        <option value="investigasi">🔍 Investigasi</option>
        <option value="terkirim">✅ Berhasil Terkirim</option>
      </select>
      <button class="rl-refresh" onclick="rlLoad()">🔄 Refresh</button>
      <button class="rl-refresh" onclick="rlDownload()" style="background:var(--success);border-color:var(--success);color:#fff">⬇️ Download</button>
    </div>
    <div id="rlBody"><div class="rl-loading"><div class="spinner"></div>Memuat data...</div></div>
  `;
}

// ── Render ─────────────────────────────────────────────────────────────────────
function rlRender() {
  const filtered = rlFiltered();

  // Update dropdowns
  const csSet   = [...new Set(_rlData.map(o => o.cs_nama).filter(Boolean))].sort();
  const ekspSet = [...new Set(_rlData.map(o => o.ekspedisi).filter(Boolean))].sort();
  const selCS   = document.getElementById('rlCSSel');
  const selEksp = document.getElementById('rlEkspSel');
  if (selCS)   selCS.innerHTML   = `<option value="">Semua CS</option>` + csSet.map(c => `<option value="${escapeHtml(c)}" ${_rlCS===c?'selected':''}>${escapeHtml(c)}</option>`).join('');
  if (selEksp) selEksp.innerHTML = `<option value="">Semua Ekspedisi</option>` + ekspSet.map(e => `<option value="${escapeHtml(e)}" ${_rlEksp===e?'selected':''}>${escapeHtml(e)}</option>`).join('');

  const total         = filtered.length;
  const terkirim      = filtered.filter(o => o.auto_resolved).length;
  const konfRetur     = filtered.filter(o => o.lapor_type === 'konfirmasi_retur' && !o.auto_resolved).length;
  const investigasi   = filtered.filter(o => o.investigasi && !o.auto_resolved && o.lapor_type !== 'konfirmasi_retur').length;
  const antarUlang    = filtered.filter(o => (o.lapor_type === 'antar_ulang' || !o.lapor_type) && !o.investigasi && !o.auto_resolved).length;
  const successRate   = total > 0 ? ((terkirim / total) * 100).toFixed(1) : '—';

  // Summary cards
  const isAll     = _rlCardFilter === '';
  const isAntar   = _rlCardFilter === 'antar_ulang';
  const isKRetur  = _rlCardFilter === 'konfirmasi_retur';
  const isInvst   = _rlCardFilter === 'investigasi';
  const isTerkirim= _rlCardFilter === 'terkirim';
  const summary = document.getElementById('rlSummary');
  if (summary) summary.innerHTML = `<div class="rl-summary">
    <div class="rl-card clickable ${isAll ? 'active' : ''}" onclick="rlCardFilter('')" title="Lihat semua">
      <div class="rl-card-label">📤 Total Lapor Ekspedisi</div>
      <div class="rl-card-num c-primary">${total}</div>
      <div class="rl-card-sub">${isAll ? '✓ Semua ditampilkan' : 'Klik untuk lihat semua'}</div>
    </div>
    <div class="rl-card clickable ${isAntar ? 'active' : ''}" onclick="rlCardFilter('antar_ulang')" title="Filter Antar Ulang">
      <div class="rl-card-label">🔄 Antar Ulang</div>
      <div class="rl-card-num" style="color:var(--primary)">${antarUlang}</div>
      <div class="rl-card-sub">${isAntar ? '✓ Difilter' : 'Sedang diproses ekspedisi'}</div>
    </div>
    <div class="rl-card clickable ${isKRetur ? 'active' : ''}" onclick="rlCardFilter('konfirmasi_retur')" title="Filter Konfirmasi Retur">
      <div class="rl-card-label">↩️ Konfirmasi Retur</div>
      <div class="rl-card-num" style="color:#a855f7">${konfRetur}</div>
      <div class="rl-card-sub">${isKRetur ? '✓ Difilter' : 'Customer minta retur'}</div>
    </div>
    <div class="rl-card clickable ${isInvst ? 'active' : ''}" onclick="rlCardFilter('investigasi')" title="Filter Investigasi">
      <div class="rl-card-label">🔍 Investigasi</div>
      <div class="rl-card-num c-danger">${investigasi}</div>
      <div class="rl-card-sub">${isInvst ? '✓ Difilter' : 'Antar ulang → tetap retur'}</div>
    </div>
    <div class="rl-card clickable ${isTerkirim ? 'active' : ''}" onclick="rlCardFilter('terkirim')" title="Filter Berhasil Terkirim">
      <div class="rl-card-label">✅ Berhasil Terkirim</div>
      <div class="rl-card-num c-success">${terkirim}</div>
      <div class="rl-card-sub">${isTerkirim ? '✓ Difilter' : 'Sampai ke customer'}</div>
    </div>
    <div class="rl-card">
      <div class="rl-card-label">📈 Success Rate</div>
      <div class="rl-card-num c-success">${successRate !== '—' ? successRate + '%' : '—'}</div>
      <div class="rl-card-sub">${successRate !== '—' ? `${terkirim} dari ${total} berhasil` : 'Belum ada data'}</div>
    </div>
  </div>`;

  // Render body
  const body = document.getElementById('rlBody');
  if (!body) return;

  if (!total) {
    body.innerHTML = `<div class="rl-section"><div class="rl-loading">📭 Belum ada data laporan ekspedisi</div></div>`;
    return;
  }

  body.innerHTML = rlEkspBreakdownHtml(filtered) + rlTableHtml(filtered);
}

// ── Ekspedisi breakdown ────────────────────────────────────────────────────────
function rlEkspBreakdownHtml(rows) {
  const ekspMap = {};
  rows.forEach(o => {
    const e = o.ekspedisi || 'Lainnya';
    if (!ekspMap[e]) ekspMap[e] = { total: 0, terkirim: 0, antar_ulang: 0, konfirmasi_retur: 0, investigasi: 0 };
    ekspMap[e].total++;
    if (o.auto_resolved)                                                   ekspMap[e].terkirim++;
    else if (o.lapor_type === 'konfirmasi_retur')                          ekspMap[e].konfirmasi_retur++;
    else if (o.investigasi)                                                ekspMap[e].investigasi++;
    else                                                                   ekspMap[e].antar_ulang++;
  });

  const cards = Object.entries(ekspMap)
    .sort((a, b) => b[1].total - a[1].total)
    .map(([eksp, d]) => {
      const successRate = d.total > 0 ? (d.terkirim / d.total * 100).toFixed(0) : 0;
      const rateColor   = successRate >= 80 ? '#06C270' : successRate >= 60 ? '#FFB703' : '#EF233C';
      return `<div class="rl-eksp-card">
        <div class="rl-eksp-name">🚚 ${escapeHtml(eksp)}</div>
        <div class="rl-eksp-row"><span class="rl-eksp-label">Total Lapor</span><span class="rl-eksp-val">${d.total}</span></div>
        <div class="rl-eksp-row"><span class="rl-eksp-label">✅ Terkirim</span><span class="rl-eksp-val" style="color:var(--success)">${d.terkirim}</span></div>
        <div class="rl-eksp-row"><span class="rl-eksp-label">🔄 Antar Ulang</span><span class="rl-eksp-val" style="color:var(--primary)">${d.antar_ulang}</span></div>
        <div class="rl-eksp-row"><span class="rl-eksp-label">↩️ Konfirm. Retur</span><span class="rl-eksp-val" style="color:#a855f7">${d.konfirmasi_retur}</span></div>
        <div class="rl-eksp-row"><span class="rl-eksp-label">🔍 Investigasi</span><span class="rl-eksp-val" style="color:var(--danger)">${d.investigasi}</span></div>
        <div class="rl-eksp-row"><span class="rl-eksp-label">Success Rate</span><span class="rl-eksp-val" style="color:${rateColor}">${successRate}%</span></div>
        <div class="rl-bar-wrap">
          <div class="rl-bar-fill" style="width:${successRate}%;background:${rateColor}"></div>
        </div>
      </div>`;
    }).join('');

  return `<div class="rl-section">
    <div class="rl-section-header">
      <div>
        <div class="rl-section-title">📊 Breakdown per Ekspedisi</div>
        <div class="rl-section-sub">Success rate = paket yang tidak balik setelah dilaporkan</div>
      </div>
    </div>
    <div class="rl-eksp-grid">${cards}</div>
  </div>`;
}

// ── Detail table ───────────────────────────────────────────────────────────────
function rlTableHtml(rows) {
  const totalPages = Math.max(1, Math.ceil(rows.length / RL_PAGE_SIZE));
  if (_rlPage > totalPages) _rlPage = 1;
  const offset   = (_rlPage - 1) * RL_PAGE_SIZE;
  const pageRows = rows.slice(offset, offset + RL_PAGE_SIZE);

  const tableRows = pageRows.map((o, i) => {
    const statusPill = o.auto_resolved
      ? `<span class="rl-pill rl-pill-ok">✅ Terkirim</span>`
      : o.lapor_type === 'konfirmasi_retur'
        ? `<span class="rl-pill" style="background:#3b1f60;color:#c4b5fd">↩️ Konfirm. Retur</span>`
        : o.investigasi
          ? `<span class="rl-pill rl-pill-invst">🔍 Investigasi</span>`
          : `<span class="rl-pill rl-pill-lapor">🔄 Antar Ulang</span>`;

    return `<tr>
      <td style="font-size:.7rem;color:var(--text-3)">${offset + i + 1}</td>
      <td><span class="rl-resi-link" data-resi="${escapeHtml(o.resi || '')}" onclick="rlOpenResi(this.dataset.resi)">${escapeHtml(o.resi || '—')}</span></td>
      <td style="font-size:.78rem">${escapeHtml(o.nama_pembeli || '—')}</td>
      <td style="font-size:.78rem">${escapeHtml(o.cs_nama || '—')}</td>
      <td style="font-size:.78rem">${escapeHtml(o.ekspedisi || '—')}</td>
      <td style="font-size:.78rem">${escapeHtml(o.kota_tujuan || '—')}</td>
      <td style="font-size:.75rem;color:var(--danger);font-weight:600">${escapeHtml(o.case_undel || '—')}</td>
      <td style="font-size:.75rem;color:var(--text-3)">${fmtTgl(o.lapor_ekspedisi_at)}</td>
      <td style="font-size:.75rem;color:var(--text-3)">${fmtTgl(o.investigasi_at || o.lapor_ekspedisi_at) || '—'}</td>
      <td>${statusPill}</td>
    </tr>`;
  }).join('');

  const pagination = totalPages > 1 ? `
    <div class="rl-pagination">
      <button class="btn btn-outline btn-sm" onclick="rlGoPage(${_rlPage-1})" ${_rlPage<=1?'disabled':''}>← Prev</button>
      <span style="font-size:.82rem;color:var(--text-2)">Halaman <strong>${_rlPage}</strong> dari <strong>${totalPages}</strong> (${rows.length} paket)</span>
      <button class="btn btn-outline btn-sm" onclick="rlGoPage(${_rlPage+1})" ${_rlPage>=totalPages?'disabled':''}>Next →</button>
    </div>` : `<div style="font-size:.75rem;color:var(--text-3);padding:10px 16px">${rows.length} paket</div>`;

  return `<div class="rl-section">
    <div class="rl-section-header">
      <div>
        <div class="rl-section-title">📋 Detail Paket Laporan</div>
        <div class="rl-section-sub">${rows.length} paket sudah dilaporkan ke ekspedisi</div>
      </div>
    </div>
    <div class="table-wrap">
      <table class="rl-table" style="width:100%">
        <thead><tr>
          <th>#</th><th>Resi</th><th>Nama Pembeli</th><th>CS</th>
          <th>Ekspedisi</th><th>Kota</th><th>Case Undel</th>
          <th>Tgl Lapor</th><th>Tgl Update</th><th>Status</th>
        </tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>
    ${pagination}
  </div>`;
}

// ── Filter & Event handlers ────────────────────────────────────────────────────
function rlFiltered() {
  // Card filter takes precedence over dropdown status filter
  const statusFilter = _rlCardFilter || _rlStatus;
  return _rlData.filter(o => {
    const lapAt = o.lapor_ekspedisi_at || o.created_at;
    if (_rlDateFrom && lapAt < _rlDateFrom) return false;
    if (_rlDateTo   && lapAt.slice(0,10) > _rlDateTo) return false;
    if (_rlCS   && o.cs_nama   !== _rlCS)   return false;
    if (_rlEksp && o.ekspedisi !== _rlEksp) return false;
    if (statusFilter === 'antar_ulang')       { if (!((o.lapor_type === 'antar_ulang' || !o.lapor_type) && !o.investigasi && !o.auto_resolved)) return false; }
    if (statusFilter === 'konfirmasi_retur')  { if (o.lapor_type !== 'konfirmasi_retur' || o.auto_resolved) return false; }
    if (statusFilter === 'investigasi')       { if (!o.investigasi || o.auto_resolved || o.lapor_type === 'konfirmasi_retur') return false; }
    if (statusFilter === 'terkirim')          { if (!o.auto_resolved) return false; }
    return true;
  });
}

function rlSetCS(v)     { _rlCS = v;     _rlPage = 1; rlRender(); }
function rlSetEksp(v)   { _rlEksp = v;   _rlPage = 1; rlRender(); }
function rlSetStatus(v) { _rlStatus = v; _rlCardFilter = ''; _rlPage = 1; rlRender(); }
function rlGoPage(p)    { _rlPage = p; document.getElementById('rlBody')?.scrollIntoView({ behavior:'smooth', block:'start' }); rlRender(); }
function rlCardFilter(v) {
  _rlCardFilter = v;
  _rlStatus = '';
  _rlPage = 1;
  // Sync dropdown kalau value ada di options
  const sel = document.getElementById('rlStatusSel');
  if (sel) sel.value = ['antar_ulang','konfirmasi_retur','investigasi','terkirim'].includes(v) ? v : '';
  rlRender();
  // Scroll ke tabel
  setTimeout(() => document.getElementById('rlBody')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
}

function rlPreset(key) {
  _rlPreset = key;
  if (key === 'bulan-ini') {
    _rlDateFrom = wibYMD().slice(0, 7) + '-01';
    _rlDateTo   = wibYMD();
  } else if (key === 'bulan-lalu') {
    const now = new Date();
    const y   = now.getMonth() === 0 ? now.getFullYear() - 1 : now.getFullYear();
    const m   = now.getMonth() === 0 ? 12 : now.getMonth();
    const mm  = String(m).padStart(2, '0');
    const last = new Date(y, m, 0).getDate();
    _rlDateFrom = `${y}-${mm}-01`;
    _rlDateTo   = `${y}-${mm}-${last}`;
  } else {
    _rlDateFrom = wibYMDOffset(-29);
    _rlDateTo   = wibYMD();
  }
  document.getElementById('rlFrom').value = _rlDateFrom;
  document.getElementById('rlTo').value   = _rlDateTo;
  document.querySelectorAll('.rl-preset').forEach(el => el.classList.remove('active'));
  event.target.classList.add('active');
  rlRender();
}

function rlSetDate() {
  _rlDateFrom = document.getElementById('rlFrom').value;
  _rlDateTo   = document.getElementById('rlTo').value;
  if (!_rlDateFrom || !_rlDateTo) return;
  _rlPreset = 'custom';
  document.querySelectorAll('.rl-preset').forEach(el => el.classList.remove('active'));
  rlRender();
}

// ── Load ───────────────────────────────────────────────────────────────────────
async function rlLoad() {
  const body = document.getElementById('rlBody');
  if (body) body.innerHTML = `<div class="rl-loading"><div class="spinner"></div>Memuat data...</div>`;
  try {
    const r = await fetch('/api/room-work?tab=lapor&limit=1000');
    if (!r.ok) throw new Error((await r.json()).error || `HTTP ${r.status}`);
    _rlData = await r.json();
    rlRender();
  } catch (e) {
    if (body) body.innerHTML = `<div class="rl-loading" style="color:var(--danger)">⚠️ Gagal: ${escapeHtml(e.message)}<br><button class="btn btn-outline btn-sm" style="margin-top:12px" onclick="rlLoad()">Coba Lagi</button></div>`;
  }
}

// ── Download Excel ─────────────────────────────────────────────────────────────
function rlDownload() {
  const rows = rlFiltered();
  if (!rows.length) { showToast('Tidak ada data untuk didownload', 'info'); return; }

  const statusLabel = {
    antar_ulang:       '🔄 Antar Ulang',
    konfirmasi_retur:  '↩️ Konfirmasi Retur',
    investigasi:       '🔍 Investigasi',
    terkirim:          '✅ Berhasil Terkirim',
  };

  const getStatus = o => {
    if (o.auto_resolved)                    return statusLabel.terkirim;
    if (o.lapor_type === 'konfirmasi_retur') return statusLabel.konfirmasi_retur;
    if (o.investigasi)                       return statusLabel.investigasi;
    return statusLabel.antar_ulang;
  };

  const data = rows.map((o, i) => ({
    'No':           i + 1,
    'Resi':         o.resi         || '',
    'Nama Pembeli': o.nama_pembeli || '',
    'Ekspedisi':    o.ekspedisi    || '',
    'Kota':         o.kota_tujuan  || '',
    'Case Undel':   o.case_undel   || '',
    'Tgl Lapor':    o.lapor_ekspedisi_at ? new Date(o.lapor_ekspedisi_at).toLocaleDateString('id-ID') : '',
    'Tgl Update':   (o.investigasi_at || o.lapor_ekspedisi_at) ? new Date(o.investigasi_at || o.lapor_ekspedisi_at).toLocaleDateString('id-ID') : '',
    'Status':       getStatus(o),
  }));

  const ws = XLSX.utils.json_to_sheet(data);
  ws['!cols'] = [
    { wch: 5 }, { wch: 22 }, { wch: 22 }, { wch: 12 }, { wch: 16 },
    { wch: 22 }, { wch: 14 }, { wch: 14 }, { wch: 22 },
  ];
  const wb = XLSX.utils.book_new();

  // Nama sheet sesuai filter aktif
  const filterKey = _rlCardFilter || _rlStatus;
  const sheetName = filterKey === 'investigasi' ? 'Investigasi'
    : filterKey === 'antar_ulang'      ? 'Antar Ulang'
    : filterKey === 'konfirmasi_retur' ? 'Konfirmasi Retur'
    : filterKey === 'terkirim'         ? 'Berhasil Terkirim'
    : 'Rekap Laporan';

  XLSX.utils.book_append_sheet(wb, ws, sheetName);

  const tgl = new Date().toISOString().slice(0, 10);
  XLSX.writeFile(wb, `RekabLaporan-${sheetName.replace(/\s/g,'-')}-${tgl}.xlsx`);
  showToast(`${rows.length} baris didownload`, 'success');
}

// ── Resi detail modal ──────────────────────────────────────────────────────────
function rlCloseResiModal() {
  document.getElementById('rlResiOverlay').classList.remove('open');
}

async function rlOpenResi(resi) {
  if (!resi) return;
  const overlay = document.getElementById('rlResiOverlay');
  const titleEl = document.getElementById('rlResiTitle');
  const infoEl  = document.getElementById('rlResiInfo');
  const bodyEl  = document.getElementById('rlResiBody');

  titleEl.textContent = resi;
  infoEl.innerHTML    = '';
  bodyEl.innerHTML    = '<div class="rl-resi-loading">⏳ Memuat riwayat pengiriman…</div>';
  overlay.classList.add('open');

  try {
    const { data, error } = await _sb
      .from('akuisisi_orders')
      .select('id,ekspedisi,status_resi,status_resi_detail,status_resi_updated_at,kota_tujuan')
      .eq('id', resi)
      .single();

    if (error || !data) {
      bodyEl.innerHTML = `<div class="rl-resi-loading">Data tidak ditemukan di database tracking.</div>`;
      return;
    }

    const STATUS_LABEL = {
      SAMPAI:'✅ Sampai', BERMASALAH:'⚠️ Bermasalah', RETUR:'↩️ Retur',
      DIKIRIM:'📦 Dikirim', OTW:'🚚 OTW', KOTA_TUJUAN:'🏙️ Kota Tujuan',
      BELUM_DICEK:'🔘 Belum Dicek', MANUAL:'📋 Manual', MANUAL_CEK:'📋 Cek Manual',
    };
    const detail    = data.status_resi_detail || {};
    const records   = Array.isArray(detail.records) ? detail.records : [];
    const updatedAt = data.status_resi_updated_at
      ? new Date(data.status_resi_updated_at).toLocaleString('id-ID', {
          timeZone: 'Asia/Jakarta', day:'2-digit', month:'short',
          hour:'2-digit', minute:'2-digit',
        })
      : '—';

    infoEl.innerHTML = `
      <div class="rl-resi-info-item">
        <div class="rl-resi-info-label">Ekspedisi</div>
        <div class="rl-resi-info-val">${escapeHtml(data.ekspedisi || '—')}</div>
      </div>
      <div class="rl-resi-info-item">
        <div class="rl-resi-info-label">Status</div>
        <div class="rl-resi-info-val">${STATUS_LABEL[data.status_resi] || data.status_resi || '—'}</div>
      </div>
      <div class="rl-resi-info-item">
        <div class="rl-resi-info-label">Kota Tujuan</div>
        <div class="rl-resi-info-val">${escapeHtml(data.kota_tujuan || '—')}</div>
      </div>
      <div class="rl-resi-info-item">
        <div class="rl-resi-info-label">Update Terakhir</div>
        <div class="rl-resi-info-val">${updatedAt}</div>
      </div>
      ${detail.masalah_kategori ? `
      <div class="rl-resi-info-item" style="grid-column:1/-1;border-right:none">
        <div class="rl-resi-info-label">Kategori Masalah</div>
        <div class="rl-resi-info-val" style="color:var(--danger)">${escapeHtml(detail.masalah_kategori)}</div>
      </div>` : ''}
    `;

    if (!records.length) {
      bodyEl.innerHTML = `<div class="rl-resi-loading">Belum ada riwayat tersimpan.<br>
        <button class="rl-resi-cek-btn" style="max-width:200px;margin:12px auto 0" onclick="rlCekResi('${escapeHtml(resi)}')">🔄 Cek Sekarang</button>
      </div>`;
      return;
    }

    bodyEl.innerHTML = `<div>
      ${records.map((r, i) => {
        let waktu = '';
        if (r.actual_time) {
          waktu = new Date(r.actual_time * 1000).toLocaleString('id-ID', {
            timeZone: 'Asia/Jakarta', day:'2-digit', month:'short',
            hour:'2-digit', minute:'2-digit',
          });
        }
        const desc = r.description || r.tracking_name || '';
        const loc  = typeof r.current_location === 'string' ? r.current_location : (r.current_location?.location_name || '');
        return `<div class="rl-tl-item${i === 0 ? ' first' : ''}">
          <div class="rl-tl-time">${escapeHtml(waktu)}</div>
          <div>
            <div class="rl-tl-desc">${escapeHtml(desc)}</div>
            ${loc ? `<div class="rl-tl-loc">📍 ${escapeHtml(loc)}</div>` : ''}
          </div>
        </div>`;
      }).join('')}
    </div>
    <button class="rl-resi-cek-btn" id="rlCekBtn" onclick="rlCekResi('${escapeHtml(resi)}')">🔄 Cek Ulang</button>`;

  } catch (e) {
    bodyEl.innerHTML = `<div class="rl-resi-loading">Error: ${escapeHtml(e.message)}</div>`;
  }
}

async function rlCekResi(resi) {
  const btn = document.getElementById('rlCekBtn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Mengecek...'; }
  try {
    const r = await fetch(`/api/tracking-check?table=akuisisi_orders&id=${encodeURIComponent(resi)}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Gagal cek');
    await rlOpenResi(resi);
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = '🔄 Cek Ulang'; }
    alert('Gagal cek resi: ' + e.message);
  }
}

// Keyboard: ESC tutup modal
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') rlCloseResiModal();
});

// ── Init ───────────────────────────────────────────────────────────────────────
(async () => {
  await initSupabaseClient();
  const user = await requireAuth();
  if (!user) return;
  renderLayout('rekap-laporan', user);
  rlRenderPage();
  await rlLoad();
})();
</script>
