<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setting — adsy-tracking</title>
<link rel="icon" type="image/png" href="img/logo-adsy.png">
<link rel="stylesheet" href="css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="sidebar-slot"></div>
<div id="header-slot"></div>
<div class="main-content">
  <div class="page" id="pageContent"></div>
</div>

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
function stCopyFu(btn, msg) {
  const text = msg.replace(/\\n/g, '\n');
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.textContent;
    btn.textContent = '✅ Copied!';
    setTimeout(() => { btn.textContent = orig; }, 1800);
  }).catch(() => {
    btn.textContent = '❌ Gagal';
    setTimeout(() => { btn.textContent = '📋 Copy'; }, 1800);
  });
}

const TIM_TABS = [
  { key: 'akuisisi', label: 'Akuisisi' },
  { key: 'crm', label: 'CRM' },
];
let timActiveDomain = 'akuisisi';
let _timMembers = [];
let timPage = 1;
const TIM_PAGE_SIZE = 5;

(async () => {
  await initSupabaseClient();
  const user = await requireAuth();
  if (!user) return;
  renderLayout('settings-tim', user);
  renderTeamPage();
})();

function renderTeamPage() {
  document.getElementById('pageContent').innerHTML = `
    <div class="card" style="margin-bottom:16px">
      <div class="card-header">
        <div class="card-header-left">
          <h3>💬 Template Follow Up</h3>
          <div class="card-sub">Pesan yang dikirim otomatis ke CS saat paket bermasalah</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:4px 0 8px">
        ${[
          { key:'info', label:'FU Info', emoji:'⚠️', color:'var(--warning)', bg:'rgba(255,183,3,.08)',
            msg:'⚠️ *[Info] Paket Bermasalah*\\n\\nHalo [nama_cs]!\\n\\nAda paket yang perlu ditindaklanjuti:\\n\\n📦 Resi: *[resi]*\\n🚚 Ekspedisi: [ekspedisi]\\n📍 Kota: [kota]\\n❌ Kasus: [kasus]\\n\\nMohon segera follow up ke kurir ya! 🙏' },
          { key:'fu1', label:'FU 1', emoji:'📨', color:'#c06000', bg:'rgba(239,140,0,.08)',
            msg:'📨 *[FU 1] Paket Bermasalah*\\n\\nHalo [nama_cs], mengingatkan:\\n\\n📦 Resi: *[resi]*\\n🚚 Ekspedisi: [ekspedisi]\\n📍 Kota: [kota]\\n❌ Kasus: [kasus]\\n\\nBelum ada update — mohon segera dikonfirmasi! 🙏' },
          { key:'fu2', label:'FU 2', emoji:'🔔', color:'#b36000', bg:'rgba(239,120,0,.08)',
            msg:'🔔 *[FU 2] Pengingat Paket Bermasalah*\\n\\nHalo [nama_cs], mengingatkan kembali:\\n\\n📦 Resi: *[resi]*\\n🚚 Ekspedisi: [ekspedisi]\\n📍 Kota: [kota]\\n❌ Kasus: [kasus]\\n\\nSudah 2 hari belum ada konfirmasi — tolong segera ditindak! 🙏' },
          { key:'fu3', label:'FU 3 (Terakhir)', emoji:'🚨', color:'var(--danger)', bg:'rgba(239,35,60,.06)',
            msg:'🚨 *[FU 3 - Terakhir] Paket Bermasalah*\\n\\nHalo [nama_cs], ini follow up terakhir:\\n\\n📦 Resi: *[resi]*\\n🚚 Ekspedisi: [ekspedisi]\\n📍 Kota: [kota]\\n❌ Kasus: [kasus]\\n\\nHarap konfirmasi hari ini ya! 🙏' },
        ].map(t => `
          <div style="border:1px solid var(--border);border-radius:12px;padding:14px;background:${t.bg}">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
              <span style="font-weight:700;font-size:.85rem;color:${t.color}">${t.emoji} ${t.label}</span>
              <button onclick="stCopyFu(this, \`${t.msg}\`)"
                style="border:1px solid var(--border);background:var(--input-bg);color:var(--text-2);border-radius:6px;padding:3px 10px;font-size:.72rem;font-weight:600;cursor:pointer">
                📋 Copy
              </button>
            </div>
            <pre style="font-size:.72rem;line-height:1.55;color:var(--text-2);background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:10px;margin:0;white-space:pre-wrap;word-break:break-word;max-height:150px;overflow-y:auto">${t.msg.replace(/\\n/g,'\\n')}</pre>
          </div>
        `).join('')}
      </div>
      <div style="font-size:.72rem;color:var(--text-3);padding:4px 0 4px">
        ⚙️ Untuk ubah isi template, edit di file <code>lib/room-work-helper.js</code> (FU Info) dan <code>cron-fu.js</code> (FU 1–3) di VPS.
      </div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="card-header">
        <div class="card-header-left">
          <h3>📱 WA Notifikasi Internal</h3>
          <div class="card-sub">Nomor WA yang dipakai kirim notif ke CS kalau ada order bermasalah</div>
        </div>
        <button class="btn btn-outline btn-sm" onclick="loadNotifStatus()">🔄 Cek Status</button>
      </div>
      <div id="notifStatusWrap" style="padding:4px 0 8px">
        <div style="color:var(--text-3);font-size:.85rem">Memuat status...</div>
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="card-header-left">
          <h3>👥 Kelola Tim CS</h3>
          <div class="card-sub">Daftar CS/tim per domain — namanya dicocokin otomatis dari kolom "Instruksi Pengiriman" pas upload, buat rute notif WA kalau order-nya bermasalah</div>
        </div>
      </div>
      <div class="tr-tabs" id="timTabs"></div>
      <div style="font-size:.78rem;color:var(--text-3);margin-bottom:12px">Data CS diambil otomatis dari CS Input — perubahan dilakukan di sistem CS Input.</div>
      <div id="timList"></div>
    </div>
  `;
  renderTimTabs();
  loadTeamMembers();
  loadNotifStatus();
}

let _notifStatusTimer = null;
async function loadNotifStatus() {
  const wrap = document.getElementById('notifStatusWrap');
  if (!wrap) return;
  try {
    const r = await fetch('/api/notif-proxy?action=qr');
    const data = await r.json();

    if (data.error) {
      wrap.innerHTML = `<div style="display:flex;align-items:center;gap:10px">
        <span style="width:10px;height:10px;border-radius:50%;background:#EF233C;display:inline-block;flex-shrink:0"></span>
        <span style="font-size:.85rem;color:var(--danger)">Service tidak bisa dihubungi — pastikan VPS & baileys-notif aktif</span>
      </div>`;
      return;
    }

    if (data.connected) {
      clearInterval(_notifStatusTimer);
      wrap.innerHTML = `<div style="display:flex;align-items:center;gap:10px">
        <span style="width:10px;height:10px;border-radius:50%;background:#06C270;display:inline-block;flex-shrink:0;box-shadow:0 0 0 3px rgba(6,194,112,.2)"></span>
        <span style="font-size:.85rem;color:var(--success);font-weight:600">Terhubung — siap kirim notif WA ke CS</span>
      </div>`;
      return;
    }

    if (data.waiting) {
      wrap.innerHTML = `<div style="display:flex;align-items:center;gap:10px">
        <span style="width:10px;height:10px;border-radius:50%;background:#FFB703;display:inline-block;flex-shrink:0"></span>
        <span style="font-size:.85rem;color:var(--text-2)">Menunggu QR... (restart baileys-notif di VPS)</span>
      </div>`;
      return;
    }

    if (data.qr) {
      clearInterval(_notifStatusTimer);
      wrap.innerHTML = `
        <div style="display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap">
          <div>
            <img src="${escapeHtml(data.qr)}" style="width:200px;height:200px;border:3px solid var(--border);border-radius:10px;display:block">
            <div style="font-size:.72rem;color:var(--text-3);margin-top:6px;text-align:center">QR expired tiap ~60 detik</div>
          </div>
          <div style="max-width:280px">
            <div style="font-weight:600;font-size:.88rem;margin-bottom:8px">📱 Cara scan:</div>
            <ol style="font-size:.82rem;color:var(--text-2);line-height:1.8;padding-left:18px;margin:0">
              <li>Buka WhatsApp di HP</li>
              <li>Setelan → Perangkat Tertaut</li>
              <li>Tautkan Perangkat</li>
              <li>Scan QR di kiri</li>
            </ol>
            <div style="margin-top:12px;font-size:.78rem;color:var(--text-3)">Gunakan nomor khusus notifikasi internal — bukan nomor CS aktif.</div>
            <button class="btn btn-outline btn-sm" style="margin-top:12px" onclick="loadNotifStatus()">🔄 Refresh QR</button>
          </div>
        </div>
      `;
      // Auto-refresh QR tiap 30 detik kalau belum terscan
      _notifStatusTimer = setInterval(loadNotifStatus, 30000);
    }
  } catch(e) {
    wrap.innerHTML = `<div style="font-size:.82rem;color:var(--text-3)">Gagal cek status: ${escapeHtml(e.message)}</div>`;
  }
}

function renderTimTabs() {
  document.getElementById('timTabs').innerHTML = TIM_TABS.map(t =>
    `<div class="tr-tab ${timActiveDomain === t.key ? 'active' : ''}" onclick="setTimTab('${t.key}')">${t.label}</div>`
  ).join('');
}

function setTimTab(domain) { timActiveDomain = domain; timPage = 1; renderTimTabs(); loadTeamMembers(); }

async function loadTeamMembers() {
  const el = document.getElementById('timList');
  el.innerHTML = `<div class="page-loading"><div class="spinner"></div></div>`;
  try {
    _timMembers = await dbGetTeamMembers(timActiveDomain);
    timPage = 1;
    renderTimList();
  } catch (e) {
    el.innerHTML = `<div style="color:var(--danger);padding:20px">Gagal memuat: ${escapeHtml(e.message)}</div>`;
  }
}

function renderTimList() {
  const el = document.getElementById('timList');
  if (!_timMembers.length) {
    el.innerHTML = `<div class="empty"><div class="icon">👥</div>Belum ada CS terdaftar di ${TIM_TABS.find(t=>t.key===timActiveDomain).label}.</div>`;
    return;
  }
  const totalPages = Math.ceil(_timMembers.length / TIM_PAGE_SIZE);
  timPage = Math.min(Math.max(timPage, 1), totalPages);
  const start = (timPage - 1) * TIM_PAGE_SIZE;
  const pageItems = _timMembers.slice(start, start + TIM_PAGE_SIZE);

  const rows = pageItems.map(m => `
    <tr>
      <td style="font-weight:600">${escapeHtml(m.name)}</td>
      <td style="font-size:.82rem">${escapeHtml(m.no_wa || '-')}</td>
      <td style="font-size:.78rem;color:var(--text-3)">${escapeHtml(m.role || '-')}</td>
    </tr>
  `).join('');

  const pagination = totalPages > 1 ? `
    <div style="display:flex;align-items:center;gap:10px;justify-content:center;padding:16px 0 4px">
      <button class="btn btn-outline btn-sm" onclick="timGoPage(${timPage - 1})" ${timPage <= 1 ? 'disabled' : ''}>← Prev</button>
      <span style="font-size:.82rem;color:var(--text-2)">Halaman <strong>${timPage}</strong> dari <strong>${totalPages}</strong> (${_timMembers.length} CS)</span>
      <button class="btn btn-outline btn-sm" onclick="timGoPage(${timPage + 1})" ${timPage >= totalPages ? 'disabled' : ''}>Next →</button>
    </div>
  ` : `<div style="font-size:.78rem;color:var(--text-3);padding:10px 0 4px">${_timMembers.length} CS terdaftar</div>`;

  el.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Nama CS</th><th>No WhatsApp</th><th>Role</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${pagination}
  `;
}

function timGoPage(page) {
  timPage = page;
  renderTimList();
  document.getElementById('timList')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' && timPage > 1) timGoPage(timPage - 1);
  if (e.key === 'ArrowRight' && timPage < Math.ceil(_timMembers.length / TIM_PAGE_SIZE)) timGoPage(timPage + 1);
});
</script>
</body>
</html>
