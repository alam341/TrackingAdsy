<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analitik Room Work — adsy-tracking</title>
<link rel="icon" type="image/png" href="img/logo-adsy.png">
<link rel="stylesheet" href="css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ── Filter bar ───────────────────────────────────────────────────── */
.ar-filter {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px 16px; margin-bottom: 16px;
}
.ar-preset {
  border: 1px solid var(--border); background: var(--input-bg); color: var(--text-2);
  border-radius: 8px; padding: 5px 14px; font-size: .78rem; font-weight: 600;
  cursor: pointer; transition: all .15s;
}
.ar-preset:hover  { border-color: var(--primary); color: var(--primary); }
.ar-preset.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.ar-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
.ar-refresh {
  margin-left: auto; border: 1px solid var(--border); background: var(--input-bg);
  color: var(--text-2); border-radius: 8px; padding: 5px 14px;
  font-size: .78rem; font-weight: 600; cursor: pointer;
}
.ar-refresh:hover { border-color: var(--primary); color: var(--primary); }

/* ── Summary cards ────────────────────────────────────────────────── */
.ar-summary {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px;
}
@media (max-width: 1000px) { .ar-summary { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px)  { .ar-summary { grid-template-columns: 1fr; gap: 10px; } }
.ar-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 18px 20px;
  transition: background .25s, border-color .25s;
}
.ar-card-label { font-size: .73rem; font-weight: 600; color: var(--text-3); margin-bottom: 6px; line-height: 1.3; }
.ar-card-num   { font-size: 2.4rem; font-weight: 800; line-height: 1; margin-bottom: 4px; }
.ar-card-sub   { font-size: .78rem; font-weight: 500; color: var(--text-2); margin-top: 2px; }

/* ── Breakdown grid ───────────────────────────────────────────────── */
.ar-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
}
@media (max-width: 900px)  { .ar-grid { grid-template-columns: 1fr; } }

.ar-box {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; overflow: hidden;
}
.ar-box-header {
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  font-size: .82rem; font-weight: 700; color: var(--text-1);
  display: flex; align-items: center; gap: 6px;
}
.ar-box-body { padding: 0; }

.ar-table { width: 100%; border-collapse: collapse; font-size: .78rem; }
.ar-table th {
  padding: 8px 12px; text-align: left; font-size: .67rem; font-weight: 600;
  color: var(--text-3); border-bottom: 1px solid var(--border);
  background: var(--input-bg); white-space: nowrap;
}
.ar-table td {
  padding: 8px 12px; border-bottom: 1px solid var(--border);
  color: var(--text-1); vertical-align: middle;
}
.ar-table tr:last-child td { border-bottom: none; }
.ar-table tr:hover td { background: var(--input-bg); }

.ar-name { font-weight: 600; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ar-rate { font-weight: 700; }
.ar-rate.good { color: var(--success); }
.ar-rate.mid  { color: var(--warning); }
.ar-rate.bad  { color: var(--danger); }

/* Rate bar */
.ar-bar { height: 5px; background: var(--border); border-radius: 3px; margin-top: 3px; min-width: 60px; }
.ar-bar-fill { height: 100%; border-radius: 3px; background: var(--success); transition: width .4s; }

/* Skeleton */
.ar-skel { height: 12px; border-radius: 6px; background: var(--border); animation: arPulse 1.2s ease-in-out infinite; }
.ar-skel.big { height: 28px; width: 50%; }
@keyframes arPulse { 0%,100%{opacity:1} 50%{opacity:.4} }

.ar-empty { padding: 28px 16px; text-align: center; color: var(--text-3); font-size: .8rem; }

/* ── Mobile ───────────────────────────────────────────────────────── */
@media (max-width: 768px) {
  .ar-filter  { gap: 7px; padding: 10px 12px; }
  .ar-refresh { margin-left: 0; }
  .ar-table th, .ar-table td { padding: 7px 9px; }
  .ar-name { max-width: 90px; }
}
@media (max-width: 480px) {
  .ar-filter { flex-direction: column; align-items: stretch; }
  .ar-preset, .ar-refresh { width: 100%; text-align: center; }
  .ar-sep    { display: none; }
  .ar-card-num { font-size: 1.8rem; }
}
</style>
</head>
<body>
<div id="sidebar-slot"></div>
<div id="header-slot"></div>
<div class="main-content">
  <div class="page" id="pageContent"></div>
</div>

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>

// ── State ──────────────────────────────────────────────────────────────────────
let _arData     = [];   // semua room_work
let _arFrom     = '';
let _arTo       = '';
let _arPreset   = 'bulan-ini';

function wibYMD(d = new Date()) {
  return new Date(d.getTime() + 7 * 3600000).toISOString().slice(0, 10);
}
function firstOfMonth(ymd) { return ymd.slice(0, 7) + '-01'; }
function prevMonthRange() {
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1);
  const from = wibYMD(d).slice(0, 7) + '-01';
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  return { from, to: wibYMD(last) };
}

(function initDates() {
  _arTo   = wibYMD();
  _arFrom = firstOfMonth(_arTo);
})();

// ── Render shell ───────────────────────────────────────────────────────────────
function arRenderPage() {
  document.getElementById('pageContent').innerHTML = `
    <div class="ar-filter">
      <button class="ar-preset ${_arPreset==='bulan-ini'?'active':''}"  onclick="arPreset('bulan-ini')">Bulan Ini</button>
      <button class="ar-preset ${_arPreset==='bulan-lalu'?'active':''}" onclick="arPreset('bulan-lalu')">Bulan Lalu</button>
      <button class="ar-preset ${_arPreset==='7h'?'active':''}"         onclick="arPreset('7h')">7 Hari</button>
      <button class="ar-preset ${_arPreset==='30h'?'active':''}"        onclick="arPreset('30h')">30 Hari</button>
      <div class="ar-sep"></div>
      <button class="ar-refresh" onclick="arLoad()">🔄 Refresh</button>
    </div>

    <div id="arSummary" class="ar-summary">
      <div class="ar-card" style="grid-column:span 2"><div class="ar-skel" style="width:55%"></div><div class="ar-skel big" style="margin:8px 0"></div><div class="ar-skel" style="width:70%"></div></div>
      ${Array(5).fill(`<div class="ar-card"><div class="ar-skel" style="width:65%"></div><div class="ar-skel big" style="margin:8px 0"></div><div class="ar-skel" style="width:75%"></div></div>`).join('')}
    </div>

    <div class="ar-grid" id="arGrid">
      ${['📦 Breakdown Ekspedisi','👤 Breakdown CS','🛍️ Breakdown Produk'].map(t => `
        <div class="ar-box">
          <div class="ar-box-header">${t}</div>
          <div class="ar-box-body"><div class="ar-empty">Memuat...</div></div>
        </div>`).join('')}
    </div>
  `;
}

// ── Preset ─────────────────────────────────────────────────────────────────────
function arPreset(key) {
  _arPreset = key;
  const today = wibYMD();
  if (key === 'bulan-ini')  { _arFrom = firstOfMonth(today); _arTo = today; }
  if (key === 'bulan-lalu') { const r = prevMonthRange(); _arFrom = r.from; _arTo = r.to; }
  if (key === '7h')  { _arFrom = wibYMD(new Date(Date.now() - 6*864e5)); _arTo = today; }
  if (key === '30h') { _arFrom = wibYMD(new Date(Date.now() - 29*864e5)); _arTo = today; }

  // update tombol active
  document.querySelectorAll('.ar-preset').forEach(b => {
    b.classList.toggle('active', b.getAttribute('onclick').includes(`'${key}'`));
  });
  arRender();
}

// ── Filter data by date ────────────────────────────────────────────────────────
function arFiltered() {
  if (!_arFrom && !_arTo) return _arData;
  return _arData.filter(o => {
    const d = (o.created_at || '').slice(0, 10);
    return (!_arFrom || d >= _arFrom) && (!_arTo || d <= _arTo);
  });
}

// ── Render ─────────────────────────────────────────────────────────────────────
function arRender() {
  const rows = arFiltered();

  // ── Summary cards ────────────────────────────────────────────────────────────
  const total           = rows.length;
  const tidakBales      = rows.filter(o => o.fu_count >= 4 && !o.cs_responded && !o.lapor_ekspedisi && !o.investigasi).length;
  const bales           = rows.filter(o => o.cs_responded).length;
  const lapor           = rows.filter(o => o.lapor_ekspedisi).length;
  const investigasi     = rows.filter(o => o.investigasi).length;
  const berhasilTerkirim = rows.filter(o => o.cs_responded && !o.investigasi).length;
  const respRate        = total ? Math.round(bales / total * 100) : 0;

  const rateColor = respRate >= 70 ? 'c-success' : respRate >= 40 ? '' : 'c-danger';

  const summaryEl = document.getElementById('arSummary');
  if (summaryEl) summaryEl.innerHTML = `
    <div class="ar-card" style="grid-column:span 2">
      <div class="ar-card-label">📦 Total Bermasalah</div>
      <div class="ar-card-num">${total.toLocaleString('id-ID')}</div>
      <div class="ar-card-sub">Semua paket yang masuk Room Work</div>
    </div>
    <div class="ar-card">
      <div class="ar-card-label">✅ Berhasil Terkirim</div>
      <div class="ar-card-num c-success">${berhasilTerkirim}</div>
      <div class="ar-card-sub">CS bales & tidak retur</div>
    </div>
    <div class="ar-card">
      <div class="ar-card-label">📊 Respons Rate CS</div>
      <div class="ar-card-num ${rateColor}">${respRate}%</div>
      <div class="ar-card-sub">CS bales / total bermasalah</div>
    </div>
    <div class="ar-card">
      <div class="ar-card-label">🚨 CS Tidak Bales</div>
      <div class="ar-card-num c-danger">${tidakBales}</div>
      <div class="ar-card-sub">Max FU, perlu eskalasi</div>
    </div>
    <div class="ar-card">
      <div class="ar-card-label">✅ CS Bales</div>
      <div class="ar-card-num c-success">${bales}</div>
      <div class="ar-card-sub">Sudah dikonfirmasi CS</div>
    </div>
    <div class="ar-card">
      <div class="ar-card-label">📤 Lapor Ekspedisi</div>
      <div class="ar-card-num c-primary">${lapor}</div>
      <div class="ar-card-sub">Sudah dilaporkan ke kurir</div>
    </div>
    <div class="ar-card">
      <div class="ar-card-label">🔍 Investigasi</div>
      <div class="ar-card-num" style="color:#7B2FBE">${investigasi}</div>
      <div class="ar-card-sub">Paket RETUR setelah lapor</div>
    </div>
  `;

  // ── Breakdown helpers ─────────────────────────────────────────────────────────
  function buildBreakdown(rows, keyFn) {
    const map = {};
    for (const o of rows) {
      const k = keyFn(o) || '—';
      if (!map[k]) map[k] = { total: 0, bales: 0, lapor: 0, investigasi: 0, tidakBales: 0 };
      map[k].total++;
      if (o.cs_responded) map[k].bales++;
      if (o.lapor_ekspedisi) map[k].lapor++;
      if (o.investigasi) map[k].investigasi++;
      if (o.fu_count >= 4 && !o.cs_responded && !o.lapor_ekspedisi && !o.investigasi) map[k].tidakBales++;
    }
    return Object.entries(map).sort((a, b) => b[1].total - a[1].total);
  }

  function rateClass(r) { return r >= 70 ? 'good' : r >= 40 ? 'mid' : 'bad'; }

  function renderTable(entries, nameLbl) {
    if (!entries.length) return `<div class="ar-empty">Belum ada data</div>`;
    return `<table class="ar-table">
      <thead><tr>
        <th>${nameLbl}</th><th>Total</th><th>Bales</th><th>Lapor</th><th>Tdk Bales</th><th>Rate</th>
      </tr></thead>
      <tbody>
        ${entries.map(([name, s]) => {
          const rate = s.total ? Math.round(s.bales / s.total * 100) : 0;
          const fill = Math.min(100, rate);
          return `<tr>
            <td><div class="ar-name" title="${escapeHtml(name)}">${escapeHtml(name)}</div></td>
            <td>${s.total}</td>
            <td class="c-success" style="font-weight:600">${s.bales}</td>
            <td class="c-primary" style="font-weight:600">${s.lapor}</td>
            <td class="c-danger"  style="font-weight:600">${s.tidakBales}</td>
            <td>
              <div class="ar-rate ${rateClass(rate)}">${rate}%</div>
              <div class="ar-bar"><div class="ar-bar-fill" style="width:${fill}%"></div></div>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
  }

  // Normalisasi ekspedisi ke uppercase agar LION + lion tidak jadi dua baris
  function normEksp(e) {
    return (e || '').toUpperCase().trim() || '—';
  }

  // Strip prefiks kuantitas: "4 BOX NEW PRIMAGOLD" → "NEW PRIMAGOLD"
  // "1 BOTOL HERBAPIL" → "HERBAPIL"
  function normProduk(raw) {
    if (!raw) return '—';
    return raw.replace(/^\d+\s*(BOX|BOTOL|PCS|PACK|SACHET|TUBE|BUAH|LEMBAR|KALENG|STRIP)\s*/i, '').trim() || raw;
  }

  const ekspedisiData = buildBreakdown(rows, o => normEksp(o.ekspedisi));
  const csData        = buildBreakdown(rows, o => o.cs_nama);
  const produkData    = buildBreakdown(rows, o => normProduk(o.produk));

  const gridEl = document.getElementById('arGrid');
  if (gridEl) gridEl.innerHTML = `
    <div class="ar-box">
      <div class="ar-box-header">📦 Breakdown Ekspedisi</div>
      <div class="ar-box-body">${renderTable(ekspedisiData, 'Ekspedisi')}</div>
    </div>
    <div class="ar-box">
      <div class="ar-box-header">👤 Breakdown CS</div>
      <div class="ar-box-body">${renderTable(csData, 'CS')}</div>
    </div>
    <div class="ar-box">
      <div class="ar-box-header">🛍️ Breakdown Produk</div>
      <div class="ar-box-body">${renderTable(produkData, 'Produk')}</div>
    </div>
  `;
}

// ── Load ───────────────────────────────────────────────────────────────────────
async function arLoad() {
  try {
    const r = await fetch('/api/room-work?tab=semua&limit=2000');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    _arData = await r.json();
    arRender();
  } catch (e) {
    _arData = [];
    arRender();
    console.error('[analitik-rw] Gagal load:', e.message);
  }
}

// ── Init ───────────────────────────────────────────────────────────────────────
(async () => {
  await initSupabaseClient();
  const user = await requireAuth();
  if (!user) return;
  renderLayout('analitik-roomwork', user);
  arRenderPage();
  await arLoad();
})();
</script>
</body>
</html>
